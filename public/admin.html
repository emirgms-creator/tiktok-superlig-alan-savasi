<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Süper Lig Alan Savaşı</title>
  <style>
    :root {
      --bg: #0b101b;
      --card: #141c2f;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 20px; }
    .open-game-btn {
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel h2 { font-size: 15px; color: #e2e8f0; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b101b;
      color: var(--text);
      font-size: 13px;
    }
    button {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      color: #fff;
      background: #334155;
    }
    button:hover { opacity: 0.9; }
    .btn-primary { background: #16a34a; }
    .btn-danger { background: #dc2626; }
    .btn-warn { background: #d97706; }
    .status-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #334155;
    }
    .status-pill.connected { background: #15803d; }
    .status-pill.connecting { background: #b45309; }
    .sim-teams {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .sim-card {
      background: #0f1626;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sim-card h3 { font-size: 14px; }
    .sim-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .log-box {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      height: 190px;
      overflow-y: auto;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-item.gift { color: #fbbf24; }
    .log-item.chat { color: #38bdf8; }
    .log-item.error { color: #f87171; }
    .log-item.success { color: #4ade80; }
    .log-item.warn { color: #fb923c; }
  </style>
</head>
<body>
  <header>
    <h1>⚽ Süper Lig Alan Savaşı — Admin</h1>
    <a class="open-game-btn" href="/" target="_blank">🎮 Oyun Ekranını Aç</a>
  </header>

  <section class="panel">
    <div class="row" style="justify-content: space-between;">
      <h2>📡 TikTok Canlı Yayın</h2>
      <span class="status-pill" id="tt-status">Bağlı Değil</span>
    </div>
    <div class="row">
      <input type="text" id="tt-username" placeholder="@tiktok_kullanici_adi" />
      <button class="btn-primary" id="btn-connect">Bağlan</button>
      <button class="btn-danger" id="btn-disconnect">Kes</button>
    </div>
  </section>

  <section class="panel">
    <div class="row" style="justify-content: space-between;">
      <h2>🧪 Yorum & Hediye Testi</h2>
      <button class="btn-warn" id="btn-reset">🔄 Yeni Tur Başlat</button>
    </div>
    <div class="row">
      <input type="text" id="admin-chat-input" placeholder="Yorum yaz (ör: GS, FB, BJK, TS)..." />
      <button class="btn-primary" id="admin-chat-send">💬 Yorum Gönder</button>
    </div>
    <div class="sim-teams" id="sim-teams"></div>
  </section>

  <section class="panel">
    <h2>📜 Olay Akışı</h2>
    <div class="log-box" id="log-box"></div>
  </section>

  <script src="/js/admin.js"></script>
</body>
</html>
